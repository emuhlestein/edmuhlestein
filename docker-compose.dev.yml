services:

  fastapi:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fastapi_app
    ports:
      - "8000:8000"   # Expose FastAPI directly to localhost:8000
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --log-level debug
    volumes:
      - .:/app
    env_file:
      .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DEBUG: "${DEBUG:-true}"
    depends_on:
      - postgres
    networks:
      - ednet
  
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    env_file:
      .env
    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB}"
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - ednet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s                 # ← gives postgres time to boot

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: my-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: "emuhlestein@yahoo.com"
      PGADMIN_DEFAULT_PASSWORD: "postgres" # ← CHANGE THIS in PRODUCTION
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy         # ← waits for postgres to be ready
    networks:
      - ednet

  cli:
    build:
      context: .
      dockerfile: Dockerfile.cli       # ← can be the same as API or specialized
    image: myproject/cli:latest
    # No ports mapping - it's not a server
    env_file:
      .env
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
      ENVIRONMENT: development
    depends_on:
      postgres:
        condition: service_healthy     # ← better startup reliability
    tty: true
    stdin_open: true                     # ← allows interactive shell
    networks:
      - ednet
    # no command → override when needed

volumes:
  db_data:
  pgadmin-data:

networks:
  ednet:
    driver: bridge