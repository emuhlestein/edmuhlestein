<!-- This is just the form + error message (no layout, no head/body) -->
<div id="login-form-container">
  {% if error %}
    <div class="error-message">
      {{ error }}
    </div>
  {% endif %}

  <form hx-post="/auth/login"
        hx-target="#login-form-container"
        hx-swap="innerHTML"
        hx-indicator="#loading"
        class="mt">

    <div class="form-group">
      <label for="username" class="block text-sm font-medium text-gray-700">Email</label>
      <input type="email" name="username" id="username"
             value="{{ email }}" required autofocus
             class="mt-1 block w-full rounded-md border-gray-300 shadow-sm">
    </div>

    <div class="form-group">
      <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
      <input type="password" name="password" id="password" required
             class="mt-1 block w-full rounded-md border-gray-300 shadow-sm">
    </div>

    <button type="submit"
            class="w-full py-2 px-4 bg-indigo-600 text-white rounded-md hover:bg-indigo-700">
      Sign In
    </button>
  </form>

  <div id="loading" class="htmx-indicator text-center text-gray-500 mt-2 hidden">
    Signing in...
  </div>
</div>
