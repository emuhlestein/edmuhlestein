<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Run</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #111;
      overflow: hidden;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #quit {
      position: fixed;
      right: 16px;
      bottom: 16px;
      z-index: 2;
      padding: 8px 14px;
      border: 0;
      border-radius: 4px;
      background: #333;
      color: #eee;
      font: 14px sans-serif;
      cursor: pointer;
    }
    #quit:hover {
      background: #444;
    }
    #waiting {
    position: fixed;
    inset: 0;
    z-index: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0;
    color: #eee;
    font: 18px sans-serif;
    pointer-events: none;
    animation: pulse 1.6s ease-in-out infinite;
    }
    @keyframes pulse {
    0%, 100% { opacity: 0.35; }
    50% { opacity: 1; }
    }
  </style>
</head>
<body>
  <div id="game"></div>
  <p id="waiting">Waiting for Node.js</p>
  <button id="quit" type="button">Quit</button>

  <script src="https://cdn.jsdelivr.net/npm/phaser@3.88.2/dist/phaser.min.js"></script>
    <script>
    const waiting = document.getElementById("waiting");
    const matchId = "42";
    const socket = new WebSocket("ws://localhost:2567/rooms/" + matchId);
    let player;

    function leave() {
        socket.close();
        window.location = "/project";
    }

    document.getElementById("quit").addEventListener("click", leave);

    class RunScene extends Phaser.Scene {
        constructor() {
        super("run");
        }

        create() {
        player = this.add.rectangle(100, 200, 32, 32, 0x285cb0);
        this.input.keyboard.on("keydown-ESC", leave);

        socket.onopen = () => {
            waiting.remove();
        };

        socket.onmessage = (event) => {
            const state = JSON.parse(event.data);
            player.x = state.player.x;
            player.y = state.player.y;
        };
        }
    }

    new Phaser.Game({
        type: Phaser.AUTO,
        parent: "game",
        backgroundColor: "#111111",
        scale: {
        mode: Phaser.Scale.RESIZE,
        width: window.innerWidth,
        height: window.innerHeight
        },
        scene: [RunScene]
    });
</script>
</body>
</html>
