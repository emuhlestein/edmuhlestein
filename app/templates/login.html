<!-- app/templates/login.html -->
{% extends "base.html" %}

{% block title %}Login - Task Manager{% endblock %}

{% block content %}
<h2>Login to Your Account</h2>


<!-- This div will be replaced by HTMX on submit -->
<div id="form-container">
    {% if error %}
        <div class="error-message">{{ error }}</div>
    {% endif %}

    <form hx-post="/auth/login"
          hx-target="#form-container"
          hx-swap="innerHTML"
          hx-indicator="#loading-spinner"
          class="mt">

        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="username" required placeholder="you@example.com" value="{{ email or '' }}">
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required placeholder="••••••••">
        </div>

        <button type="submit">Log In</button>
    </form>
    <!-- Loading indicator – shown automatically during request -->
    <div id="loading-spinner" class="htmx-indicator" style="display: none; text-align: center; margin-top: 1rem;">
        <span>Logging in...</span>
    </div>
</div>


<div class="links">
    <p>Don't have an account? <a href="/auth/register" class="reg-link">Register here</a></p>
    <p><a href="/" class="reg-link">← Back to Home</a></p>
</div>

{% endblock %}
