{% extends "base.html" %}

{% block title %}Login - Task Manager{% endblock %}

{% block content %}
<h2>Login to Your Account</h2>

<div id="form-container">
    {% if error %}
        <div class="error-message">{{ error }}</div>
    {% endif %}

    <form action="/auth/login" method="post" class="mt">
      <div class="form-group">
      	<label for="email">Email</label>
        <input type="email" id="email" name="username" autocomplete="username" required placeholder="you@example.com" value="{{ email or '' }}">
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="password-field">
					<input type="password" id="password" name="password" autocomplete="current-password">
					<button type="button" class="toggle-password" aria-label="Show password">
					<svg class="eye" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
							<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
							<circle cx="12" cy="12" r="3"></circle>
					</svg>
					<svg class="eye-off" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
						<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
						<path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
						<circle cx="12" cy="12" r="3"/>
						<line x1="1" y1="1" x2="23" y2="23"/>
					</svg>
					</button>
        </div>
      </div>
  	<button type="submit">Log In</button>
  </form>
</div>


<div class="links">
    <p>Don't have an account? <a href="/auth/register" class="reg-link">Register here</a></p>
    <p><a href="/" class="reg-link">← Back to Home</a></p>
</div>

{% endblock %}
