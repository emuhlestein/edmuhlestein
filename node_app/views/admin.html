<!-- app/templates/about.html -->
{% extends "base.html" %}

{% block content %}
<main>
  <h1 id="title"></h1>
  <div class="controls">
    <button id="prev">← Prev</button>
    <button id="next">Next →</button>
    <button id="clear">Clear colors</button>
		<button id="year-btn">Year view</button>
  </div>
  <div id="month-view">
		<div id="cal" class="calendar"></div>
	</div>
	<div id="year-view" style="display: none;">
		<div class="year-row">
			<!-- months 0–3 -->
		</div>
		<div class="year-row">
			<!-- months 4–7 -->
		</div>
		<div class="year-row">
			<!-- months 8–11 -->
		</div>
	</div>
</main>

<footer>
    {% if current_user %}
    Signed in as {{ current_user }}
    {% else %}
    &copy; Ed Muhlestein
    {% endif %}
</footer>
{% endblock %}
