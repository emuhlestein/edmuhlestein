{% extends "study_base.html" %}

{% block content %}
<h2>New document</h2>

<div class="doc-wide">
<form method="post" action="/documents">
  <div class="form-group">
    <label for="title">Title</label>
    <input type="text" id="title" name="title" required>
  </div>

  <div class="form-group">
    <label for="slug">Slug</label>
    <input type="text" id="slug" name="slug" placeholder="employee-handbook">
  </div>

  <div class="form-group">
    <label for="body_text">Body</label>
    <textarea
      id="body_text"
      name="body_text"
      class="body-paste"
      rows="24"
      placeholder="Paste or type the document here."
    ></textarea>
  </div>

  <button type="submit">Save</button>
</form>
</div>

<footer>
    {% if current_user %}
    Signed in as {{ current_user }}
    {% else %}
    &copy; Ed Muhlestein
    {% endif %}
</footer>
{% endblock %}
